name: Deploy

# Applies .do/app.yaml to the DigitalOcean app and deploys main, once CI passed
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# The token only needs to read the repository
permissions:
  contents: read

jobs:
  deploy:
    # Only deploy pushes to main of this repository. workflow_run has access to the secrets, so never run it for CI runs
    # of pull requests (a fork can have a branch called main too)
    if: >-
      github.repository == 'mastometrics/web' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          # Logs of public repositories are public, the app's runtime logs (deploy logs) contain account handles
          print_build_logs: true
          print_deploy_logs: false
